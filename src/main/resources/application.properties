# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5433/geotravel
spring.datasource.username=geotravel_user
spring.datasource.password=geotravel123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Con Hibernate 6 + hibernate-spatial NO se necesita dialecto espacial explícito
# Hibernate 6 lo detecta automáticamente con PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect